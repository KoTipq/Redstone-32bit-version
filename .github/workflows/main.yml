name: Build Redstone (armv7 / armv7s)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          rm -rf "$HOME/theos/sdks"
          mv "$HOME/theos-sdks" "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Pick iOS SDK (10.x, fallback 9.3)
        run: |
          SDK=$(ls "$HOME/theos/sdks" | grep -E '^iPhoneOS10\.[0-9]+\.sdk$' | sort -V | tail -1)
          if [ -z "$SDK" ]; then
            SDK=$(ls "$HOME/theos/sdks" | grep -E '^iPhoneOS9\.[0-9]+\.sdk$' | sort -V | tail -1)
          fi
          if [ -z "$SDK" ]; then echo "No iOS 9/10 SDK found in theos/sdks"; exit 1; fi
          VER=${SDK#iPhoneOS}; VER=${VER%.sdk}
          echo "Using SDK $VER"
          echo "SDKVER=$VER" >> "$GITHUB_ENV"

      - name: Build .deb
        working-directory: Redstone
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1 \
            TARGET="iphone:clang:${SDKVER}:9.0" \
            ARCHS="armv7 armv7s" \
            ADDITIONAL_LDFLAGS="-Wl,-ld_classic -Wl,-undefined,dynamic_lookup"

      - name: Check architectures
        working-directory: Redstone
        run: |
          find .theos -name 'Redstone.dylib' -exec lipo -info {} \;

      - name: Check for broken symbols (fails if tweak code is missing)
        working-directory: Redstone
        run: |
          for f in $(find .theos -name 'Redstone.dylib'); do
            echo "== $f"
            for a in armv7 armv7s; do
              echo "-- $a: symbols resolved only at runtime:"
              nm -arch $a -mu "$f" | grep "dynamically looked up" || true
            done
          done
          BAD=$(for f in $(find .theos -name 'Redstone.dylib'); do nm -mu "$f" | grep "dynamically looked up" | grep -E "_logos|_OBJC_CLASS|RS[A-Z]" || true; done)
          if [ -n "$BAD" ]; then
            echo "ERROR: tweak's own symbols are missing, it will not load on the device:"
            echo "$BAD"
            exit 1
          fi

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Redstone-armv7-deb
          path: Redstone/packages/*.deb
