name: Build Redstone (armv7 / armv7s)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install tools
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          rm -rf "$HOME/theos/sdks"
          mv "$HOME/theos-sdks" "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Pick iOS SDK (10.x, fallback 9.3)
        run: |
          SDK=$(ls "$HOME/theos/sdks" | grep -E '^iPhoneOS10\.[0-9]+\.sdk$' | sort -V | tail -1)
          if [ -z "$SDK" ]; then
            SDK=$(ls "$HOME/theos/sdks" | grep -E '^iPhoneOS9\.[0-9]+\.sdk$' | sort -V | tail -1)
          fi
          if [ -z "$SDK" ]; then echo "No iOS 9/10 SDK found in theos/sdks"; exit 1; fi
          VER=${SDK#iPhoneOS}; VER=${VER%.sdk}
          echo "Using SDK $VER"
          echo "SDKVER=$VER" >> "$GITHUB_ENV"

      - name: Build .deb
        working-directory: Redstone
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1 \
            TARGET="iphone:clang:${SDKVER}:9.0" \
            ARCHS="armv7 armv7s" \
            ADDITIONAL_LDFLAGS="-Wl,-ld_classic"

      - name: Check architectures
        working-directory: Redstone
        run: |
          find .theos -name 'Redstone.dylib' -exec lipo -info {} \;

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Redstone-armv7-deb
          path: Redstone/packages/*.deb
